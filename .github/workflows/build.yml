name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar projeto (usa aldora-apk.zip se existir na raiz)
        run: |
          if [ -f aldora-apk.zip ]; then mkdir -p proj && unzip -q -o aldora-apk.zip -d proj && echo "DIR=proj" >> "$GITHUB_ENV"; else echo "DIR=." >> "$GITHUB_ENV"; fi
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Aceitar licencas do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Chave de assinatura fixa
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then mkdir -p ~/.android && echo "$KS" | base64 -d > ~/.android/debug.keystore && echo "KS_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV" && echo "Chave fixa aplicada"; else echo "AVISO: segredo DEBUG_KEYSTORE_B64 ausente, usando chave temporaria (o APK nao atualiza por cima de outro)"; fi
      - name: Mostrar impressao digital da chave (SHA1)
        run: keytool -list -v -keystore ~/.android/debug.keystore -storepass android 2>/dev/null | grep -E "Alias|SHA1" || echo "sem chave ainda"
      - name: Compilar
        working-directory: ${{ env.DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Mostrar assinatura do APK pronto
        continue-on-error: true
        run: |
          APK=$(find . -name app-debug.apk | head -1)
          echo "APK: $APK"
          AS=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          echo "apksigner: $AS"
          "$AS" verify --print-certs "$APK" 2>&1 | head -20 || true
          echo "--- via keytool ---"
          keytool -printcert -jarfile "$APK" 2>&1 | grep -E "SHA1|SHA256" | head -4 || true
      - uses: actions/upload-artifact@v4
        with:
          name: ReinosDeAldora-apk
          path: ${{ env.DIR }}/app/build/outputs/apk/debug/app-debug.apk
