plugins { id 'com.android.application' }
android {
    namespace 'com.aldora.game'
    compileSdk 34
    defaultConfig { applicationId "com.aldora.game"; minSdk 24; targetSdk 34; versionCode 52; versionName "3.31" }
    def ksPath = System.getenv('KS_PATH')
    if (ksPath && new File(ksPath).exists()) {
        signingConfigs { debug { storeFile file(ksPath); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
    }
    buildTypes { release { signingConfig signingConfigs.debug } }
    lint { abortOnError false; checkReleaseBuilds false }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
